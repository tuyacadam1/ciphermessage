<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES Google Sheets Cipher Board</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; max-width: 1400px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; color: #38bdf8; }
    
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin: 0 auto 32px; border: 1px solid #334155; max-width: 600px; }
    textarea, input[type="text"] { width: 100%; padding: 10px; margin: 8px 0 16px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #fff; }
    button { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    
    /* --- 5-Column Grid Layout for Public Feed --- */
    #feed {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    /* Responsive fallback for smaller screens */
    @media (max-width: 1200px) { #feed { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) { #feed { grid-template-columns: repeat(1, 1fr); } }

    .post { 
      background: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      padding: 14px; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .post-header { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .post-text { font-family: monospace; font-size: 0.8rem; background: #0f172a; padding: 10px; border-radius: 4px; word-break: break-all; color: #f43f5e; margin-bottom: 8px; }
    .post-text.unlocked { color: #4ade80; font-family: system-ui, sans-serif; font-size: 0.95rem; font-weight: 600; }
    .post-hint { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 12px; font-style: italic; }
    
    .decrypt-row { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .decrypt-row input { margin: 0; font-size: 0.85rem; padding: 8px; }
    .decrypt-row button { width: 100%; background: #16a34a; padding: 8px; font-size: 0.85rem; }
    .solved-badge { background: #166534; color: #4ade80; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; width: fit-content; }
  </style>
</head>
<body>

  <h1>Google Sheets Secret Board</h1>

  <div class="card">
    <label>Secret Message (Words, Numbers & Symbols)</label>
    <textarea id="messageInput" placeholder="Write something secret... e.g. Room 101 at 8:30 PM!"></textarea>

    <label>Encryption Passphrase</label>
    <input type="text" id="passphraseInput" placeholder="Passphrase required to decrypt">
    
    <label>Hint (Optional)</label>
    <input type="text" id="hintInput" placeholder="Give a clue for the key">

    <label>Your Name / Alias</label>
    <input type="text" id="authorInput" placeholder="Who is posting this?">

    <button onclick="submitPost()">Post AES Encrypted Message</button>
  </div>

  <h2>Public Feed</h2>
  <div id="feed">Loading messages...</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8cA9f8wz-xk4FoNWv4mnZ8AKUul9zpiBSZ3sYwyCgKvJnEGOWmgAPOH2e20Bnzes_/exec";

    // --- AES-GCM Web Crypto Helper Functions ---
    async function getAesKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("fixed-salt-app"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptAES(text, passphrase) {
      const key = await getAesKey(passphrase);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encodedText = new TextEncoder().encode(text);
      
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encodedText);
      
      const combined = new Uint8Array(iv.length + encrypted.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(encrypted), iv.length);
      
      return btoa(String.fromCharCode(...combined));
    }

    async function decryptAES(cipherBase64, passphrase) {
      try {
        const key = await getAesKey(passphrase);
        const combined = Uint8Array.from(atob(cipherBase64), c => c.charCodeAt(0));
        const iv = combined.slice(0, 12);
        const data = combined.slice(12);

        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return null;
      }
    }

    // --- App Operations ---
    async function submitPost() {
      const msg = document.getElementById('messageInput').value.trim();
      const passphrase = document.getElementById('passphraseInput').value.trim();
      const hint = document.getElementById('hintInput').value.trim();
      const encryptedBy = document.getElementById('authorInput').value.trim() || "Anonymous";

      if (!msg || !passphrase) return alert('Enter both a message and an encryption passphrase.');

      const cipherText = await encryptAES(msg, passphrase);

      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          cipherText: cipherText,
          hint: hint,
          encryptedBy: encryptedBy
        })
      });

      document.getElementById('messageInput').value = '';
      document.getElementById('passphraseInput').value = '';
      document.getElementById('hintInput').value = '';
      loadPosts();
    }

    async function loadPosts() {
      try {
        const res = await fetch(SCRIPT_URL);
        const posts = await res.json();
        const feed = document.getElementById('feed');

        if (posts.length === 0) {
          feed.innerHTML = '<p style="color:#94a3b8; grid-column: span 5;">No messages yet.</p>';
          return;
        }

        feed.innerHTML = posts.map(p => {
          const isSolved = Boolean(p.plaintext);
          return `
            <div class="post">
              <div>
                <div class="post-header">
                  <span>By: ${p.encryptedBy || 'Anonymous'}</span>
                  <span>${p.timestamp}</span>
                  ${isSolved ? `<span class="solved-badge">Unlocked by ${p.decryptedBy || 'Unknown'}</span>` : ''}
                </div>
                
                <div class="post-text ${isSolved ? 'unlocked' : ''}" id="text-${p.id}">
                  ${isSolved ? p.plaintext : p.cipherText}
                </div>

                ${p.hint ? `<div class="post-hint">Hint: ${p.hint}</div>` : ''}
              </div>

              ${!isSolved ? `
                <div class="decrypt-row">
                  <input type="text" placeholder="Your Name" id="solver-${p.id}">
                  <input type="text" placeholder="Passphrase" id="key-${p.id}">
                  <button onclick="tryDecrypt('${p.id}', '${p.cipherText}')">Decrypt</button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('feed').innerHTML = '<p style="color:#f43f5e; grid-column: span 5;">Error loading posts.</p>';
      }
    }

    async function tryDecrypt(id, cipherText) {
      const keyInput = document.getElementById(`key-${id}`);
      const solverInput = document.getElementById(`solver-${id}`);
      
      const passphrase = keyInput.value.trim();
      const decryptedBy = solverInput.value.trim() || "Anonymous";

      if (!passphrase) return alert('Enter a passphrase to decrypt.');

      const decryptedText = await decryptAES(cipherText, passphrase);

      if (decryptedText !== null) {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'decrypt',
            id: id,
            plaintext: decryptedText,
            decryptedBy: decryptedBy
          })
        });

        alert('Decryption successful!');
        loadPosts();
      } else {
        alert('Incorrect passphrase. Access denied.');
      }
    }

    loadPosts();
  </script>
</body>
</html>
